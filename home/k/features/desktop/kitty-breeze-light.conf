# Breeze Light, from Plasma's Breeze Light colour scheme, which has no
# terminal colours of its own.

# The window background, a dimmed white, rather than the views' pure
# white, and the window text.
background #eff0f1
foreground #232629
cursor #232629
cursor_text_color #eff0f1

# The selection, as everywhere in Breeze.
selection_background #3daee9
selection_foreground #ffffff
url_color #0070b9

# Konsole's Breeze, the dark one, made to read on the light background:
# each colour keeps its hue, as kitty switches between the two, and is
# darkened in OKLCH only as far as it takes to reach 4.5:1 against the
# background, or 3:1 for the bright ones. Those that already did are
# Konsole's own.
color0 #232629
color8 #7f8c8d

color1 #db020a
color9 #c0392b

color2 #017f05
color10 #019c6b

color3 #b05100
color11 #b67f03

color4 #0070b9
color12 #1192cc

color5 #9351ae
color13 #8e44ad

color6 #007b65
color14 #089b81

color7 #e3e5e7
color15 #fcfcfc

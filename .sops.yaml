keys:
  # f's age key, ~/.config/sops/age/keys.txt on fw16: edits every file,
  # and decrypts f's own there.
  - &f_fw16 age1n4zzx32smd586l062y5hg47cg7ec94wcy2rcgcp5khjahjyc0sgsls8f3f
  # fw12's own age key, /persist/var/lib/sops-nix/key.txt there: decrypts
  # at boot, and edits there as in nixos/optional/sops.nix.
  - &fw12 age1w9r3gr7ndyu4hqrxxkz6ys2r2682lqu2jnpmlnv2ju2yem6k3pds6rcvxv
creation_rules:
  # f's own, decrypted with f's key at login: home/f/global/secrets.nix.
  - path_regex: home/f/secrets\.yaml$
    key_groups:
      - age:
          - *f_fw16
  - path_regex: hosts/fw12/secrets\.yaml$
    key_groups:
      - age:
          - *f_fw16
          - *fw12

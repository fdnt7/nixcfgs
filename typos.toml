[default]
extend-ignore-re = [
  # Ignore lines that end with `# spellchecker:disable-line`
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
  # Ignore blocks between `# spellchecker:off` and `# spellchecker:on`
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
  # Ignore age blocks between `-----BEGIN AGE ENCRYPTED FILE-----` and `-----END AGE ENCRYPTED FILE-----`
  '-----BEGIN AGE ENCRYPTED FILE-----\n(?: *[A-Za-z0-9+/=]+\n)+ *-----END AGE ENCRYPTED FILE-----',

  # Ignore short and full commit hashes, like "ba2846c"
  '\b[0-9a-f]{7,40}\b',
  # Ignore nvd's package lines, like "[U.] sord 0.16.20", in commit messages
  '(?m)^\[[A-Z][.+*-]\] .*$',
  # Ignore "lazer"
  '\bosu[-! ]lazer(-bin)?\b',
]
locale = "en-gb"

[default.extend-words]
# A real word, which typos does not know
thumbnailers = "thumbnailers"

[files]
extend-exclude = ["LICENSE"]

[type.diff]
extend-ignore-re = [
  # Ignore context and removed lines: upstream's text, only added lines are ours
  '(?m)^[ -].*$',
]

[type.diff.extend-identifiers]
# Ignore "color" in the identifiers qtengine's patch touches
KColorScheme = "KColorScheme"
loadColorScheme = "loadColorScheme"

[type.jsonc]
extend-glob = ["*.jsonc"]
extend-ignore-re = [
  # Ignore "color" in keys
  '"color":',
]

[type.nix]
extend-ignore-re = [
  # Ignore "analyzer", "color", "colors", "initialization" in attribute names:
  # attrpaths first on their line, assigned to
  '(?m)^\s*(programs\.eza\.colors|programs\.zed-editor\.userSettings\.lsp\.rust-analyzer\.initialization_options|theme\.colorScheme)\s*=',
  # Ignore "color" in eza's flag
  '"--color-scale=',
]

[type.kdl]
extend-glob = ["*.kdl"]
extend-ignore-re = [
  # Ignore "center", "color" in niri's options: node names, first on their line
  '(?m)^\s*(active-color|backdrop-color|background-color|center-focused-column|inactive-color)\s',
  # Ignore "center", "maximize" in niri's actions: alone in a bind's block
  '\{\s*(center-column|center-visible-columns|maximize-column|maximize-window-to-edges)\s*;',
]
